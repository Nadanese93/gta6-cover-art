<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Skyline Studio — GTA 6-style cover maker</title>
<link rel="stylesheet" href="css/studio.css">
</head>
<body>
<header class="topbar">
  <h1>Neon Skyline Studio</h1>
  <p class="tagline">Turn your photos into GTA 6-style cover art. Pick a layout, pick a grade, export a PNG.</p>
</header>

<main class="workbench">
  <section class="stage">
    <div id="dropZone" class="dropzone">
      <canvas id="preview" width="900" height="900"></canvas>
      <p class="hint">Drag photos here, or use the upload button. Click a panel to edit it, drag to pan, scroll to zoom.</p>
    </div>
    <p id="status" class="status" role="status"></p>
  </section>

  <aside class="panel">
    <section class="group">
      <h2>Photos</h2>
      <label class="upload-btn" for="fileInput">Upload photos (up to 4)</label>
      <input id="fileInput" type="file" accept="image/*" multiple hidden>
      <div class="sample-row">
        <button data-sample="dusk" type="button">Dusk Boulevard</button>
        <button data-sample="pier" type="button">Pier Dusk</button>
        <button data-sample="ride" type="button">Street Ride</button>
        <button data-sample="fuel" type="button">Neon Fuel</button>
      </div>
    </section>

    <section class="group">
      <h2>Layout</h2>
      <div class="btn-row">
        <button data-layout="solo" type="button">Solo</button>
        <button data-layout="hero" type="button">Hero Stack</button>
        <button data-layout="quad" type="button">Quad</button>
        <button data-layout="strip" type="button">Film Strip</button>
        <button data-layout="slant" type="button">Slanted</button>
        <button data-layout="mosaic" type="button">Mosaic</button>
      </div>
    </section>

    <section class="group">
      <h2>Grade</h2>
      <div class="btn-row">
        <button data-grade="sunset" type="button">Sunset</button>
        <button data-grade="neon" type="button">Neon</button>
        <button data-grade="vice" type="button">Vice</button>
        <button data-grade="noir" type="button">Noir</button>
        <button data-grade="gold" type="button">Golden Hour</button>
      </div>
    </section>

    <section class="group">
      <h2>Caption</h2>
      <label>Title <input id="titleInput" type="text" value="NEON SKYLINE" maxlength="28"></label>
      <label>Subtitle <input id="subtitleInput" type="text" value="Neon Coast nights" maxlength="48"></label>
      <label>Badge <input id="badgeInput" type="text" value="NEON COAST" maxlength="18"></label>
      <div class="heat-row">
        <span>Heat</span>
        <button data-heat="1" type="button" aria-label="1 star">★</button>
        <button data-heat="2" type="button" aria-label="2 stars">★</button>
        <button data-heat="3" type="button" aria-label="3 stars">★</button>
        <button data-heat="4" type="button" aria-label="4 stars">★</button>
        <button data-heat="5" type="button" aria-label="5 stars">★</button>
      </div>
    </section>

    <section class="group">
      <h2 id="panelLabel">Panel 1</h2>
      <label>Photo in this panel
        <select id="panelPhoto"></select>
      </label>
      <label>Zoom <input id="zoomRange" type="range" min="100" max="400" value="100"></label>
    </section>

    <section class="group">
      <h2>Finish</h2>
      <div class="btn-row">
        <button data-size="1080x1080" type="button">1080 × 1080</button>
        <button data-size="1080x1350" type="button">1080 × 1350</button>
        <button data-size="1920x1080" type="button">1920 × 1080</button>
        <button data-size="1080x1920" type="button">1080 × 1920</button>
      </div>
      <label class="check"><input id="grainToggle" type="checkbox" checked> Film grain</label>
      <label class="check"><input id="vignetteToggle" type="checkbox" checked> Vignette</label>
      <div class="actions">
        <button id="undoBtn" type="button">Undo</button>
        <button id="redoBtn" type="button">Redo</button>
        <button id="exportBtn" type="button" class="primary">Export PNG</button>
      </div>
    </section>
  </aside>
</main>

<script src="js/poster.js"></script>
<script type="module" src="js/workbench.js"></script>
</body>
</html>
